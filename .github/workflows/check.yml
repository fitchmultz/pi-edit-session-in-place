name: compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: compatibility / compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PI_OFFLINE: "1"
      PI_COMPAT_EXPECTED_PACKAGE_DIR: ${{ github.workspace }}/node_modules/@earendil-works/pi-coding-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Qualify manifest-pinned official Pi
        run: npm run check
        env:
          PI_COMPAT_HOST: official
      - name: Check out the maintained fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/pi
          ref: f371064864ef239d66a81ee645a6774dc525be40
          path: .pi/fork
          persist-credentials: false
      - name: Build the fork SDK
        working-directory: .pi/fork
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run hydrate:model-data
          npm run build:offline
      - name: Install the fork SDK cohort
        run: node scripts/install-fork.mjs .pi/fork
      - name: Qualify the maintained fork
        run: |
          PI_COMPAT_EXPECTED_VERSION="$(node -p 'require("./.pi/fork/packages/coding-agent/package.json").version')"
          export PI_COMPAT_EXPECTED_VERSION
          npm run check
        env:
          PI_COMPAT_HOST: fitchmultz/pi@f371064864ef239d66a81ee645a6774dc525be40
