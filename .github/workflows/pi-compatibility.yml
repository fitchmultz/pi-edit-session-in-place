name: Pi compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PI_AUTOMATION_REF: a0fdc5780053237ac4ee24f49976ee5449e3aaab # v1.0.1

jobs:
  compatibility:
    name: compatibility / compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      npm_config_cache: ${{ github.workspace }}/.npm-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: extension
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/.github
          ref: ${{ env.PI_AUTOMATION_REF }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: fork
        with:
          repository: fitchmultz/pi
          ref: main
          path: fork
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Use the automation npm version
        run: npm install --global "$(node -p 'require("./automation/package.json").packageManager')"
      - name: Check fork support floor
        id: fork-support
        env:
          FORK_REF: ${{ steps.fork.outputs.commit }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { appendFileSync, mkdirSync, readFileSync, writeFileSync } from "node:fs";
          const version = JSON.parse(readFileSync("fork/packages/coding-agent/package.json")).version;
          const match = /^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?(?:\+[0-9A-Za-z.-]+)?$/.exec(version);
          assert.ok(match, `Invalid fork version: ${version}`);
          const supported = Number(match[1]) >= 1 && !version.startsWith("1.0.0-");
          appendFileSync(process.env.GITHUB_OUTPUT, `supported=${supported}\n`);
          if (!supported) {
            const receipt = { result: "unattempted", host: "fork", ref: process.env.FORK_REF, version, floor: "1.0.0", reason: "Fork is older than the supported Pi floor; no build or qualification attempted." };
            mkdirSync(`${process.env.RUNNER_TEMP}/fork-evidence`, { recursive: true });
            writeFileSync(`${process.env.RUNNER_TEMP}/fork-evidence/qualification.json`, JSON.stringify(receipt, null, 2) + "\n");
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Fork qualification: UNATTEMPTED\n\nFork \`${receipt.ref}\` is Pi ${version}, below the supported 1.0.0 floor. This is not a future-fork pass. Rerun qualification when the maintained fork reaches the floor.\n`);
            console.log(JSON.stringify(receipt));
          }
          NODE
      - name: Build the exact fork revision
        if: steps.fork-support.outputs.supported == 'true'
        working-directory: fork
        env:
          PI_OFFLINE: '1'
          PI_TELEMETRY: '0'
        run: |
          fork_ref=$(git rev-parse HEAD)
          echo "Fork ref: $fork_ref"
          npm ci --ignore-scripts
          npm run hydrate:model-data
          git diff --exit-code
          npm run build:offline
          node ../automation/scripts/pack-fork.mjs . "$RUNNER_TEMP/fork-package" "$fork_ref"
          git diff --exit-code
      - name: Use the extension npm version
        run: npm install --global "$(node -p 'require("./extension/package.json").packageManager')"
      - name: Qualify official Pi
        run: |
          official_version=$(node -p 'require("./extension/package.json").devDependencies["@earendil-works/pi-coding-agent"]')
          node automation/scripts/qualify.mjs --repo pi-edit-session-in-place --source "$GITHUB_WORKSPACE/extension" \
            --host official --target "$official_version" --output "$RUNNER_TEMP/official"
      - name: Qualify the fork
        if: steps.fork-support.outputs.supported == 'true'
        run: |
          fork_ref=$(git -C fork rev-parse HEAD)
          PI_COMPAT_FORK_REF="$fork_ref" node automation/scripts/qualify.mjs \
            --repo pi-edit-session-in-place --source "$GITHUB_WORKSPACE/extension" \
            --host fork --target "$RUNNER_TEMP/fork-package" --output "$RUNNER_TEMP/fork"
      - name: Retain unsupported fork receipt
        if: steps.fork-support.outputs.supported == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fork-unattempted
          path: ${{ runner.temp }}/fork-evidence
          if-no-files-found: error
          retention-days: 3
